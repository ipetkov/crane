name: publish flakehub
on:
  workflow_dispatch: # for allowing manual triggers of the workflow
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-flakehub:
    name: publish-flakehub
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write" # Necessary for authenticating against FlakeHub
      contents: "read"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: DeterminateSystems/flakehub-push@e001ee821cdb763ef120c01f1048bfb2f938bb9c # v7
        with:
          visibility: "public"
